<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dao Den Long</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0e1a; font-family: monospace; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      display: flex; gap: 16px; color: #aaff66; font-size: 14px;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #hud span { background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 4px; }
    #overlay {
      position: fixed; inset: 0; z-index: 20;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.7); color: #fff; text-align: center;
    }
    #overlay h2 { font-size: 28px; margin-bottom: 8px; }
    #overlay p { font-size: 14px; color: #aaa; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module" src="src/main.js"></script>
</body>
</html>
